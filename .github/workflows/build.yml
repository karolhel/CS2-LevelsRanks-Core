name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        working-directory: Core
        run: dotnet build "[LR] Core.csproj" -c Release -o ../out
      - name: Package
        run: |
          dest="dist/addons/counterstrikesharp/plugins/[LR] Core"
          mkdir -p "$dest"
          cp "out/[LR] Core.dll" out/Dapper.dll out/MySqlConnector.dll "$dest/"
          cd dist && zip -r ../LR-Core.zip addons
      - uses: actions/upload-artifact@v4
        with:
          name: LR-Core
          path: dist
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LR-Core.zip
          generate_release_notes: true
