name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        working-directory: Core
        run: dotnet build "[LR] Core.csproj" -c Release -o ../out
      - name: Package
        run: |
          dest="dist/addons/counterstrikesharp/plugins/[LR] Core"
          mkdir -p "$dest"
          cp "out/[LR] Core.dll" out/Dapper.dll out/MySqlConnector.dll "$dest/"
          cd dist && zip -r ../LR-Core.zip addons
      - uses: actions/upload-artifact@v4
        with:
          name: LR-Core
          path: dist
      - name: Release (once per version)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'ModuleVersion => "\Kv?[0-9.]+' "Core/[LR] Core.cs")
          TAG="v${VER#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" LR-Core.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          fi
